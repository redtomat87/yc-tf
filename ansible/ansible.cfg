[defaults]
# Облачный inventory пишет Terraform; локальный стенд: -i inventories/local
inventory           = inventories/yc/hosts.yml
roles_path          = roles
interpreter_python  = /usr/bin/python3
vault_password_file = .vault
result_format       = yaml
callbacks_enabled   = ansible.posix.profile_tasks
retry_files_enabled = False
forks               = 10
timeout             = 30
nocows              = True

[ssh_connection]
pipelining = True
# Ключ новой ВМ принимается при первом подключении, смена ключа — ошибка.
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
