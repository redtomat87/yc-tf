---
# Общие для всех плейбуков данные площадки. Секреты — в vault.yml (vault_*),
# пример структуры — vault.yml.example.

site_domain: redtomat.ru

# --- Порты на 127.0.0.1 --------------------------------------------
# Всё, кроме 22/80/443, слушает только loopback; Angie проксирует сюда.
app_ports:
  angie_status: 8079
  node_exporter: 9100
  wordpress: 8090
  mysqld_exporter: 9104
  keycloak: [8081, 8082]
  keycloak_management: [9011, 9012]
  grafana: 3000
  prometheus: 9090
  podman_exporter: 9882
  test_backends: [9001, 9002, 9003, 9004]

# --- Angie ---------------------------------------------------------
angie_vhosts:
  console: { order: 10, server_name: "angie.{{ site_domain }}" }
  static: { order: 20, server_name: "static.{{ site_domain }}" }
  wordpress: { order: 30, server_name: "daily.{{ site_domain }}" }
  grafana: { order: 40, server_name: "grafana.{{ site_domain }}" }
  keycloak: { order: 50, server_name: "auth.{{ site_domain }}" }
  test_backends: { order: 60, server_name: "angie-backend.{{ site_domain }}" }

angie_basic_auth_users: "{{ vault_basic_auth_users }}"
angie_basic_auth_salt: "{{ vault_basic_auth_salt }}"

static_site_root: /var/www/static
