---
# Локальный стенд (libvirt) для репетиции без облака:
#
#   ansible-playbook -i inventories/local site.yml
#
# Переопределения задаются на уровне хоста, а не группы: переменные
# группы из inventory слабее group_vars/ рядом с плейбуками и были бы
# молча проигнорированы.
#
# ACME из частной сети не пройдёт, поэтому заказы идут в staging
# Let's Encrypt, и роль не ждёт выпуска.
all:
  hosts:
    vm-resolute:
      ansible_host: 192.168.122.84
      ansible_user: vk
      angie_acme_ca: https://acme-staging-v02.api.letsencrypt.org/directory
      angie_acme_wait_retries: 0
  children:
    web:
      hosts:
        vm-resolute:
    apps:
      hosts:
        vm-resolute:
