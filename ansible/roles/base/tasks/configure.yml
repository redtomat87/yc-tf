---
- name: Enable AppArmor
  ansible.builtin.systemd_service:
    name: apparmor
    enabled: true
    state: started

# Наружу порт не нужен: только loopback и, если Prometheus на другой ВМ, частный IP.
- name: Set node_exporter listen addresses
  ansible.builtin.lineinfile:
    path: /etc/default/prometheus-node-exporter
    regexp: "^ARGS="
    line: 'ARGS="{{ base_node_exporter_listen | map("regex_replace", "^", "--web.listen-address=") | join(" ") }}"'
    create: true
    owner: root
    group: root
    mode: "0644"
  notify: Restart node_exporter

- name: Enable node_exporter
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter
    enabled: true
    state: started

# Jail sshd включён пакетом (jail.d/defaults-debian.conf); jail'ы Angie кладёт роль angie.
- name: Enable fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    enabled: true
    state: started
