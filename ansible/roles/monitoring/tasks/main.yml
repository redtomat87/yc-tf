---
- name: Deploy monitoring
  tags: [config, monitoring_config]
  block:
    - name: Render podman-exporter manifest
      ansible.builtin.template:
        src: podman-exporter.yml.j2
        dest: /etc/containers/systemd/podman-exporter.yml
        owner: root
        group: root
        mode: "0644"
      register: monitoring_exporter_manifest

    - name: Run podman-exporter pod
      ansible.builtin.include_role:
        name: podman_kube
      vars:
        podman_kube_name: podman-exporter
        podman_kube_description: Prometheus exporter for Podman
        podman_kube_userns: host
        podman_kube_manifest_changed: "{{ monitoring_exporter_manifest is changed }}"

    - name: Render Prometheus manifest
      ansible.builtin.template:
        src: prometheus.yml.j2
        dest: /etc/containers/systemd/prometheus.yml
        owner: root
        group: root
        mode: "0644"
      register: monitoring_prometheus_manifest

    - name: Run Prometheus pod
      ansible.builtin.include_role:
        name: podman_kube
      vars:
        podman_kube_name: prometheus
        podman_kube_description: Prometheus
        podman_kube_manifest_changed: "{{ monitoring_prometheus_manifest is changed }}"

    # Grafana в сети хоста ходит к Keycloak за токеном. Без этой записи запрос шёл бы
    # на публичный адрес ВМ, а на hairpin через NAT облака полагаться нельзя.
    - name: Resolve Keycloak host to the local Angie
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.0\.1\s+{{ monitoring_keycloak_host | regex_escape }}$'
        line: "127.0.0.1 {{ monitoring_keycloak_host }}"
        owner: root
        group: root
        mode: "0644"

    # 0600: в манифесте Secret с паролями (base64 — не шифрование).
    - name: Render Grafana manifest
      ansible.builtin.template:
        src: grafana.yml.j2
        dest: /etc/containers/systemd/grafana.yml
        owner: root
        group: root
        mode: "0600"
      register: monitoring_grafana_manifest

    - name: Run Grafana pod
      ansible.builtin.include_role:
        name: podman_kube
      vars:
        podman_kube_name: grafana
        podman_kube_description: Grafana
        podman_kube_requires: [prometheus.service]
        podman_kube_manifest_changed: "{{ monitoring_grafana_manifest is changed }}"
