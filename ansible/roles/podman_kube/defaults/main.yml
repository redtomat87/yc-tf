---
# Общий механизм запуска Kubernetes YAML через Quadlet (.kube). Вызывается из
# прикладных ролей через include_role; манифест <name>.yml кладёт сама прикладная роль.
#
#   podman_kube_name: имя юнита: /etc/containers/systemd/<name>.kube -> <name>.service
#   podman_kube_manifest_changed: менялся ли манифест (register прикладной роли)
podman_kube_name: ""
podman_kube_manifest_changed: false
podman_kube_description: "{{ podman_kube_name }}"

# Порты публикуются здесь, а не hostPort в YAML: манифест остаётся пригодным для Kubernetes.
# Всегда на 127.0.0.1, а с remote: true — ещё на частном IP ВМ (потребитель на другой ВМ).
# [{port: 8090, container_port: 80, remote: "{{ remote_consumers.web }}"}, ...]
podman_kube_publish: []
# Сеть Quadlet (<name>.network) или "host"; пусто — сеть podman по умолчанию.
podman_kube_network: ""
# auto: свой диапазон UID/GID на pod, root в контейнере не root на хосте.
# host — только для того, кому нужен root хоста (podman-exporter и сокет Podman).
podman_kube_userns: auto
# Диапазон закреплён за юнитом: слот N -> host ID base + N*65536, 65536 ID.
# Без закрепления pod при пересоздании может получить другой диапазон, и файлы
# в его томах окажутся чужими. 65536 покрывает и nobody (65534).
# Слоты — podman_userns_slots в group_vars, по имени юнита.
podman_kube_userns_slot: "{{ podman_userns_slots[podman_kube_name] }}"
podman_kube_userns_base: 2147483647
podman_kube_userns_size: 65536
# Юниты, которые должны быть запущены раньше: ["keycloak-postgres.service"]
podman_kube_requires: []

# Ожидание: все контейнеры pod'а running, а с healthcheck — healthy.
podman_kube_wait_retries: 60
podman_kube_wait_delay: 5

podman_kube_dir: /etc/containers/systemd

# Контейнеры должны работать под профилем AppArmor из containers.conf, не unconfined.
podman_kube_apparmor_profile_prefix: containers-default-
